<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>@socialitu</title>
<style>
:root{--bg1:#4b1fb8;--bg2:#9b5cff;--card:rgba(255,255,255,.14);--line:rgba(255,255,255,.28);--text:#fff;--muted:rgba(255,255,255,.8);--btn:#fff;--btntext:#3b1fa3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2f1278;--bg2:#6a35c9;--card:rgba(255,255,255,.1)}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:linear-gradient(135deg,var(--bg1),var(--bg2)) fixed;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:24px 16px}
.wrap{width:100%;max-width:420px;position:relative;z-index:2}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.fl{position:fixed;z-index:1;font-size:64px;line-height:1;pointer-events:none;user-select:none;animation:fl 6s ease-in-out infinite}
.bear{left:6%;top:14%;filter:drop-shadow(0 0 18px rgba(200,160,255,.9))}
.frog{right:7%;bottom:12%;font-size:72px;animation-delay:-3s;filter:sepia(1) saturate(4) hue-rotate(-8deg) brightness(1.25) drop-shadow(0 0 20px rgba(255,200,60,.95))}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-22px) rotate(6deg)}}
@media (max-width:560px){.fl{font-size:44px}.frog{font-size:50px}.bear{top:4%;left:4%}.frog{bottom:3%;right:4%}}
@media (prefers-reduced-motion:reduce){.fl{animation:none}}
.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:12px}
.lang button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.lang button.on{background:var(--btn);color:var(--btntext);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:32px 24px;text-align:center;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(20,10,60,.35)}
.av{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.3)}
h1{margin:16px 0 6px;font-size:28px}
.sub{color:var(--muted);margin:0 0 16px}
.txt{font-size:15px;line-height:1.5;color:var(--muted);margin:0 0 18px}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px}
.tags span{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;background:rgba(255,255,255,.08)}
.btns{display:flex;flex-direction:column;gap:10px}
.btn{display:block;padding:14px;border-radius:16px;font-size:16px;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid var(--line);font-family:inherit}
.p{background:var(--btn);color:var(--btntext)}
.s{background:transparent;color:var(--text)}
.foot{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
</style>
</head>
